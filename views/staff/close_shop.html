<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Closing Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-gray-50">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden p-6 space-y-6">
        <div class="text-center">
            <h2 class="text-2xl font-bold text-gray-800">Shop Closing</h2>
            <p class="text-sm text-gray-500 mt-1">Enter final inventory numbers for the day</p>
        </div>

        <form action="/api/close-shop" method="POST" class="space-y-4">
            
            <!-- Item Selection -->
            <div>
                <label for="item_id" class="block text-sm font-medium text-gray-700 mb-1">Select Item</label>
                <select id="item_id" name="item_id" class="block w-full px-4 py-3 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 rounded-lg border bg-gray-50 shadow-sm" required>
                    <option value="" disabled selected>Select an item...</option>
                    <option value="1">BBQ Telapia</option>
                    <!-- Additional items will be populated here -->
                </select>
            </div>

            <!-- Closing Quantity -->
            <div>
                <label for="closing_qty" class="block text-sm font-medium text-gray-700 mb-1">Closing Quantity (End of Day)</label>
                <input type="number" id="closing_qty" name="closing_qty" min="0" class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-gray-50 text-base" placeholder="e.g. 5" required>
            </div>

            <!-- Wastage Quantity -->
            <div>
                <label for="wastage_qty" class="block text-sm font-medium text-gray-700 mb-1">Wastage / Spoiled</label>
                <input type="number" id="wastage_qty" name="wastage_qty" min="0" class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-gray-50 text-base" placeholder="e.g. 2" required>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-base font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
                    Submit Closing Data
                </button>
            </div>
        </form>
    </div>

</body>
</html>
